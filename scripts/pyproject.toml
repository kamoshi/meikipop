[project]
name = "meikipop-dictionary-scripts"
version = "0.1.0"
description = "Development environment for MeikiPop's standalone dictionary scripts"
requires-python = ">=3.11"
dependencies = [
    "cbor2>=6.1,<7",
    "lxml>=5,<7",
    "requests>=2.31,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.19",
    "types-lxml",
    "types-requests",
]

[tool.uv]
package = false
