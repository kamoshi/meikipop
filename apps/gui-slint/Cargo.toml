[package]
name = "meikipop-gui"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
cuda = ["meikipop-native/cuda"]

[dependencies]
fontdb = "0.23"
futures-util = "0.3"
meikipop-native = { path = "../../crates/native" }
slint = { version = "=1.17.0", default-features = false, features = [
    "compat-1-2",
    "image-default-formats",
    "std",
    "system-tray",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-io = "2.6"
raw-window-handle = "0.6"
slint = { version = "=1.17.0", default-features = false, features = [
    "backend-winit-x11",
    "raw-window-handle-06",
    "renderer-femtovg",
] }
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
slint = { version = "=1.17.0", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg-wgpu",
] }

[build-dependencies]
slint-build = "=1.17.0"
