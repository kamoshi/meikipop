# .github/workflows/build-dictionary.yml
name: reusable dictionary build

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 7:00 AM UTC
  workflow_dispatch: # Also allow manual trigger

permissions:
  contents: write # Needed to create/update the release

jobs:
  build-dictionary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: build dictionary
        run: uv run scripts/build_dictionary.py

      - name: compress dictionary
        run: |
          mv /home/runner/.local/share/meikipop/dictionary.cbor .
          zip dictionary.zip dictionary.cbor

      - name: update dictionary-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dictionary-latest --yes --cleanup-tag || true
          gh release create dictionary-latest \
            --title "dictionary (latest)" \
            --notes "most recent meikipop dictionary file" \
            --prerelease \
            dictionary.zip
