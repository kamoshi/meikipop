[package]
name = "meikipop-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "meikipop_native"
crate-type = ["rlib"]

[dependencies]
crossbeam-channel = "0.5"
hf-hub = { version = "1.0", features = ["blocking"] }
log = "0.4"
ndarray = "0.17"
opencv = { version = "0.100", default-features = false, features = ["imgproc"] }
ort = { version = "=2.0.0-rc.13", features = ["download-binaries", "ndarray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.4"
unicode-general-category = "1"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
async-io = "2.6"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
x11rb = "0.13"
zbus = "=5.19.0"
zbus_macros = "=5.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
screencapturekit = "=1.4.2"
