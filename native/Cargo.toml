[package]
name = "meikipop-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "meikipop_native"
crate-type = ["cdylib"]

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
async-io = "2.6"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.4"
zbus = "=5.13.2"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
